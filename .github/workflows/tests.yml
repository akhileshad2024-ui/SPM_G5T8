# Runs the backend and frontend tests automatically.
#
# The log of each run is the evidence of testing:
# GitHub repo -> Actions -> run -> "Unit / Integration Tests" or "frontend".
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit / Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The tests import the backend (FastAPI, SQLAlchemy, ...), so its packages are needed.
      # pytest runs the per-story test folders; httpx is what FastAPI's TestClient uses.
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest httpx coverage

      # Unit tests only. They use an in-memory database and never touch Supabase,
      # so no secrets or .env file are needed. "-s tests/unit" is needed because plain
      # "python -m unittest discover" finds nothing: the tests live in tests/unit/.
      - name: Run unit tests
        run: python scripts/test_evidence.py run --kind unit --scope backend -- python -m unittest discover -s tests/unit -v

      # Every Python test: the per-story folders (tests/us01_secure_login, tests/us02_rbac,
      # tests/us03_us04_event_request, tests/us13_event_status), tests/unit and tests/integration.
      # tests/conftest.py points them at a throwaway SQLite database, never Supabase.
      - name: Run all backend tests with statement and branch coverage
        run: |
          mkdir -p coverage_reports/project/latest/backend
          python scripts/test_evidence.py run --kind backend

      # The recording wrapper generates coverage reports even after a test failure.
      - name: Upload backend coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.sha }}
          path: coverage_reports/project/latest/backend/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload test execution records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-history-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage_reports/project/ci/
          if-no-files-found: warn
          retention-days: 90

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.13 for execution records
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Vitest unit tests for every story (tests/**/*.unit.test.ts).
      - name: Run frontend unit tests with coverage
        run: python scripts/test_evidence.py run --kind frontend

      - name: Upload frontend coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: coverage_reports/project/latest/frontend/
          if-no-files-found: warn
          retention-days: 90

      - name: Build
        run: npm run build

      - name: Upload test execution records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-history-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage_reports/project/ci/
          if-no-files-found: warn
          retention-days: 90

  # Functional (end-to-end) tests: a real browser drives the real app (playwright.config.ts).
  # Playwright starts FastAPI on a throwaway SQLite database and Next.js itself; no secrets needed.
  functional:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: Run functional tests
        run: python scripts/test_evidence.py run --kind functional

      - name: Upload functional test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: functional-report-${{ github.sha }}
          path: coverage_reports/project/latest/functional/
          if-no-files-found: warn
          retention-days: 90

      - name: Upload test execution records
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-history-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage_reports/project/ci/
          if-no-files-found: warn
          retention-days: 90
